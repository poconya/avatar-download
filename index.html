<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会場限定 アバターダウンロードページ</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="container">

    <!-- タイトル -->
    <h1>会場限定</h1>
    <h2>アバターダウンロードページ</h2>

    <p class="intro">
      ダウンロードしたいキャラクターを選択してください。
    </p>


    <!-- キャラクター選択 -->
    <section class="character-select">

      <!-- ラト -->
      <button
        class="character-button"
        onclick="selectCharacter('lato')"
      >
        <img
          src="images/s_la.png"
          alt="ラト"
        >
      </button>


      <!-- ユーハン -->
      <button
        class="character-button"
        onclick="selectCharacter('yuhan')"
      >
        <img
          src="images/s_yu.png"
          alt="ユーハン"
        >
      </button>


      <!-- ロノ -->
      <button
        class="character-button"
        onclick="selectCharacter('lono')"
      >
        <img
          src="images/s_lo.png"
          alt="ロノ"
        >
      </button>


      <!-- バスティン -->
      <button
        class="character-button"
        onclick="selectCharacter('bastien')"
      >
        <img
          src="images/s_ba.png"
          alt="バスティン"
        >
      </button>

    </section>


    <!-- 選択したキャラクター -->
    <section class="download-area">

      <p id="selected-name">
        キャラクターを選択してください
      </p>


      <img
        id="selected-image"
        class="selected-image"
        src=""
        alt=""
      >


      <a
        id="download-button"
        class="download-button"
        href="#"
        download
        style="display:none;"
      >
        ダウンロード
      </a>

    </section>


    <!-- 使用ルール -->
    <section class="rules">

      <h2>使用ルール</h2>


      <p>⭕ OK</p>

      <ul>
        <li>pictSQUARE内での使用</li>
        <li>スクリーンショット・動画撮影</li>
        <li>SNSへの掲載</li>
      </ul>


      <p>❌ NG</p>

      <ul>
        <li>画像の加工・改変</li>
        <li>自作発言</li>
        <li>二次配布</li>
      </ul>


      <p class="notice">
        その他の用途で使用したい場合は、事前にご連絡ください。
      </p>

    </section>

  </main>


  <script>

    /* キャラクター情報 */

    const characters = {

      lato: {
        name: "ラト",
        image: "images/Sabaku_lato.png",
        filename: "Sabaku_lato.png"
      },


      yuhan: {
        name: "ユーハン",
        image: "images/Sabaku_yuhan.png",
        filename: "Sabaku_yuhan.png"
      },


      lono: {
        name: "ロノ",
        image: "images/Sabaku_lono.png",
        filename: "Sabaku_lono.png"
      },


      bastien: {
        name: "バスティン",
        image: "images/Sabaku_Bastien.png",
        filename: "Sabaku_Bastien.png"
      }

    };


    /* キャラクターを選択 */

    function selectCharacter(id) {

      const character = characters[id];


      const image =
        document.getElementById("selected-image");

      const name =
        document.getElementById("selected-name");

      const button =
        document.getElementById("download-button");


      /* 選択した画像を表示 */

      image.src = character.image;

      image.alt = character.name;


      /* キャラクター名 */

      name.textContent =
        character.name + " を選択中";


      /* ダウンロード */

      button.href = character.image;

      button.download = character.filename;

      button.style.display = "inline-block";

    }

  </script>

</body>

</html>
