<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>会場限定 アバターダウンロードページ</title>

  <!-- Zen Old Mincho -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div class="stars"></div>
<div class="bright-stars">
  <span>✦</span>
  <span>✦</span>
  <span>✦</span>
  <span>✦</span>
  <span>✦</span>
</div>
 
  <main class="container">

    <!-- タイトル -->
    <h1>会場限定</h1>

    <h2 class="page-title">
      アバターダウンロードページ
    </h2>


    <p class="intro">
      ダウンロードしたいキャラクターを選択してください。
    </p>


    <!-- キャラクター選択 -->
    <section class="character-select">

      <button
        class="character-button"
        onclick="selectCharacter('lato')"
      >
        <img
          src="images/s_la.png"
          alt="ラト"
        >
      </button>


      <button
        class="character-button"
        onclick="selectCharacter('yuhan')"
      >
        <img
          src="images/s_yu.png"
          alt="ユーハン"
        >
      </button>


      <button
        class="character-button"
        onclick="selectCharacter('lono')"
      >
        <img
          src="images/s_lo.png"
          alt="ロノ"
        >
      </button>


      <button
        class="character-button"
        onclick="selectCharacter('bastien')"
      >
        <img
          src="images/s_ba.png"
          alt="バスティン"
        >
      </button>

    </section>


    <!-- 選択したキャラクター -->
    <section class="download-area">

      <p id="selected-name">
        キャラクターを選択してください
      </p>


      <img
        id="selected-image"
        class="selected-image"
        src=""
        alt=""
      >


      <a
        id="download-button"
        class="download-button"
        href="#"
        download
        style="display:none;"
      >
        ダウンロード
      </a>

    </section>


    <!-- 使用ルール -->
    <section class="rules">

      <h2>■使用ルール■</h2>


      <h3>－OK－</h3>

      <ul>
        <li>pict SQUARE(ピクスク)内での使用（使用報告不要）</li>
        <li>スクショ・動画撮影・SNSへの掲載</li>
      </ul>


      <h3>－NG－</h3>

      <ul>
        <li>加工・改変</li>
        <li>自作発言</li>
        <li>二次配布</li>
      </ul>


      <h3>－要連絡－</h3>

      <ul>
        <li>
          pict SQUARE外での使用
          <br>
          <span class="notice">
            → 使用を希望される場合は、事前にご連絡ください
          </span>
        </li>
      </ul>

    </section>

  </main>


  <script>

    const characters = {

      lato: {
        name: "ラト",
        image: "images/Sabaku_lato.png",
        filename: "Sabaku_lato.png"
      },


      yuhan: {
        name: "ユーハン",
        image: "images/Sabaku_yuhan.png",
        filename: "Sabaku_yuhan.png"
      },


      lono: {
        name: "ロノ",
        image: "images/Sabaku_lono.png",
        filename: "Sabaku_lono.png"
      },


      bastien: {
        name: "バスティン",
        image: "images/Sabaku_Bastien.png",
        filename: "Sabaku_Bastien.png"
      }

    };


    function selectCharacter(id) {

      const character = characters[id];

      const image =
        document.getElementById("selected-image");

      const name =
        document.getElementById("selected-name");

      const button =
        document.getElementById("download-button");


      image.src = character.image;

      image.alt = character.name;

      name.textContent =
        character.name + " を選択中";

      button.href = character.image;

      button.download = character.filename;

      button.style.display = "inline-block";

    }

  </script>

</body>

</html>
